<!DOCTYPE html>
<html lang="en">
<head></head>
<body>
	<pre id="content">Loading README.md ...</pre>

	<script>
		fetch("README.md")
			.then(res => {
				if (!res.ok) throw new Error(`HTTP ${res.status}`);
				return res.text();
			})
			.then(text => {
				document.getElementById('content').innerHTML = text;
			});
	</script>
</body>
</html>
